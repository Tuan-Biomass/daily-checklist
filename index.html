<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shift Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1c2321;
    --paper:#eef0ec;
    --panel:#ffffff;
    --line:#c8cdc4;
    --accent:#3a6351;
    --accent-dim:#e4ece7;
    --warn:#a4462c;
    --mono: 'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --sans: 'IBM Plex Sans',-apple-system,Segoe UI,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    padding:32px 16px 80px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{
    border-bottom:3px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .logo-spot{
    width:52px;
    height:52px;
    border:2px dashed var(--accent);
    border-radius:8px;
    background:var(--accent-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .operator-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:12px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 18px;
    margin-bottom:24px;
  }
  .operator-row label{
    display:block;
    font-family:var(--mono);
    font-size:0.72rem;
    color:#666;
    margin-bottom:4px;
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .operator-row input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:0.9rem;
  }
  .operator-row input:read-only{
    background:#f3f4f1;
    color:#333;
    font-family:var(--mono);
    opacity:1;
  }
  @media (max-width:520px){
    .operator-row{grid-template-columns:1fr;}
  }
  h1{
    font-size:1.6rem;
    margin:0;
    letter-spacing:-0.02em;
  }
  .tag{
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .meta{
    font-family:var(--mono);
    font-size:0.78rem;
    color:#555;
    text-align:right;
  }
  section.block{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:4px;
    margin-bottom:20px;
    overflow:hidden;
  }
  section.block.done{border-left-color:#8aa89b;}
  .block-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    cursor:pointer;
    user-select:none;
  }
  .block-head h2{
    font-size:1rem;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .count{
    font-family:var(--mono);
    font-size:0.75rem;
    color:#777;
  }
  .items{padding:0 18px 16px;}
  label.item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-top:1px solid #eee;
    font-size:0.95rem;
    cursor:pointer;
  }
  label.item:first-child{border-top:none;}
  label.item input{
    margin-top:3px;
    width:17px;height:17px;
    accent-color:var(--accent);
    flex-shrink:0;
  }
  label.item span.checked-text{
    text-decoration:line-through;
    color:#999;
  }
  .item-row{
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:9px 0;
    border-top:1px solid #eee;
  }
  .item-row:first-child{border-top:none;}
  .item-row label.item{
    padding:0;
    border-top:none;
  }
  .item-comment{
    margin-left:27px;
    width:calc(100% - 27px);
    padding:6px 9px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:0.82rem;
    color:#444;
  }
  .item-comment::placeholder{color:#aaa;}
  .notes{
    width:100%;
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--sans);
    font-size:0.85rem;
    padding:8px 10px;
    resize:vertical;
    min-height:44px;
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:26px;
    flex-wrap:wrap;
  }
  button{
    font-family:var(--sans);
    font-weight:600;
    font-size:0.9rem;
    border:none;
    border-radius:4px;
    padding:12px 20px;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2c4d40;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--accent);}
  .btn-primary:disabled{background:#a9b8b1;cursor:not-allowed;}
  #status{
    font-family:var(--mono);
    font-size:0.82rem;
    margin-top:12px;
    min-height:1.2em;
  }
  #status.ok{color:var(--accent);}
  #status.err{color:var(--warn);}
  .settings{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:24px;
  }
  .settings summary{
    cursor:pointer;
    font-family:var(--mono);
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#555;
  }
  .settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:14px;
  }
  .settings-grid .full{grid-column:1/-1;}
  .settings-grid label{
    display:block;
    font-family:var(--mono);
    font-size:0.72rem;
    color:#666;
    margin-bottom:4px;
  }
  .settings-grid input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    font-family:var(--mono);
    font-size:0.85rem;
  }
  @media (max-width:520px){
    .settings-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <img src="albioma-logo.png" alt="ALBIOMA Logo" class="app-logo" />
        <svg viewBox="0 0 48 48" width="40" height="40">
          <circle cx="24" cy="24" r="22" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
          <path d="M14 25l7 7 13-15" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="tag">Shift checklist</div>
        <h1> Daily Checks Log</h1>
      </div>
    </div>
    <div class="meta" id="clock"></div>
  </header>

  <div class="operator-row">
    <div>
      <label for="operatorName">Operator name</label>
      <input type="text" id="operatorName" placeholder="Full name">
    </div>
    <div>
      <label>Date</label>
      <input type="text" id="operatorDate" readonly>
    </div>
    <div>
      <label>Time completed</label>
      <input type="text" id="operatorTime" readonly>
    </div>
  </div>

  <details class="settings" id="settingsBox">
    <summary>🔒 GitHub log settings (PIN protected)</summary>
    <div class="settings-grid">
      <div class="full">
        <label for="ghToken">Personal Access Token (repo scope)</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
      </div>
      <div>
        <label for="ghOwner">Repo owner</label>
        <input type="text" id="ghOwner" placeholder="your-username">
      </div>
      <div>
        <label for="ghRepo">Repo name</label>
        <input type="text" id="ghRepo" placeholder="checklist-repo">
      </div>
      <div>
        <label for="ghBranch">Branch</label>
        <input type="text" id="ghBranch" placeholder="main" value="main">
      </div>
      <div>
        <label for="ghPath">Log file path</label>
        <input type="text" id="ghPath" placeholder="log.xlsx" value="log.xlsx">
      </div>
      <div class="full">
        <button class="btn-ghost" id="saveSettings" type="button">Save settings</button>
      </div>
      <div class="full" style="border-top:1px solid var(--line);margin-top:6px;padding-top:14px;">
        <label for="newPin">Set / change PIN (leave blank for no lock)</label>
        <input type="password" id="newPin" placeholder="4+ digit PIN" inputmode="numeric">
      </div>
      <div class="full">
        <button class="btn-ghost" id="setPinBtn" type="button">Save PIN</button>
        <button class="btn-ghost" id="lockNowBtn" type="button">Lock now</button>
      </div>
    </div>
  </details>
  <div id="pinStatus" style="font-family:var(--mono);font-size:0.78rem;color:#666;margin:-16px 0 20px;"></div>

  <section class="block" data-section="Before Startup">
    <div class="block-head">
      <h2>🟢Start Of Shift / Before Startup</h2>
      <span class="count">0 / 5</span>
    </div>
    <div class="items">
      <div class="item-row"><label class="item"><input type="checkbox"><span>Check Grecon is OK</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Check Grecon Tank is On "operational Level</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Check Water Sprayers are Functioning Correctly</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      
    </div>
  </section>

  <section class="block" data-section="During Processing">
    <div class="block-head">
      <h2>🟡 During Processing</h2>
      <span class="count">0 / 5</span>
    </div>
    <div class="items">
      <div class="item-row"><label class="item"><input type="checkbox"><span>Check Mill Adjustment Sheet is Up to Date</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Purge Mills with 200 pumps each @ 9 AM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Purge Mills with 200 pumps each @ 3 PM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Purge Mills with 200 pumps each @ 9 PM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Purge Mills with 200 pumps each @ 3 AM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Inspect & Clean Steam Vent @ 530 PM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Inspect & Clean Steam Vent @ 530 AM</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Empty Drop Box At End of Shift</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div> 
    </div>
  </section>

  <section class="block" data-section="Once a Week">
    <div class="block-head">
      <h2>🔵 Once a Week</h2>
      <span class="count">0 / 5</span>
    </div>
    <div class="items">
      <div class="item-row"><label class="item"><input type="checkbox"><span>Deep Clean Around Mills </span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Clean Diverters / Shavings 1 into 2 Transition</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Check Dinking Water Tank Level</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
      <div class="item-row"><label class="item"><input type="checkbox"><span>Empty All Bins And Wheel Barrows</span></label><input type="text" class="item-comment" placeholder="Comment (optional)"></div>
  
    </div>
  </section>

  <textarea class="notes" id="sessionNotes" placeholder="Optional notes for this session..."></textarea>

  <div class="actions">
    <button class="btn-primary" id="pushBtn">Save & push to GitHub</button>
    <button class="btn-ghost" id="resetBtn" type="button">Reset checklist</button>
  </div>
  <div id="status"></div>

</div>

<script>
// ---------- clock ----------
function tick(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString();
  document.getElementById('operatorDate').value = now.toISOString().slice(0,10);
  document.getElementById('operatorTime').value = now.toTimeString().slice(0,8);
}
tick(); setInterval(tick, 1000);

// ---------- settings persistence ----------
const fields = ['ghToken','ghOwner','ghRepo','ghBranch','ghPath'];
fields.forEach(id=>{
  const saved = localStorage.getItem('checklist_'+id);
  if(saved) document.getElementById(id).value = saved;
});
document.getElementById('saveSettings').addEventListener('click', ()=>{
  fields.forEach(id=>{
    localStorage.setItem('checklist_'+id, document.getElementById(id).value.trim());
  });
  setStatus('Settings saved locally in this browser.', 'ok');
});

// ---------- PIN lock ----------
function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}
let settingsUnlocked = false;
const settingsBox = document.getElementById('settingsBox');
const pinStatusEl = document.getElementById('pinStatus');

function pinIsSet(){
  return !!localStorage.getItem('checklist_pin_hash');
}
function refreshPinStatus(){
  pinStatusEl.textContent = pinIsSet()
    ? 'Settings are PIN-locked.'
    : 'No PIN set — anyone opening this page can view/edit GitHub settings.';
}
refreshPinStatus();

settingsBox.addEventListener('toggle', ()=>{
  if(settingsBox.open && pinIsSet() && !settingsUnlocked){
    settingsBox.open = false;
    const entered = prompt('Enter PIN to access GitHub log settings:');
    if(entered === null) return;
    if(simpleHash(entered) === localStorage.getItem('checklist_pin_hash')){
      settingsUnlocked = true;
      settingsBox.open = true;
    } else {
      alert('Incorrect PIN.');
    }
  }
});

document.getElementById('setPinBtn').addEventListener('click', ()=>{
  const val = document.getElementById('newPin').value.trim();
  if(val === ''){
    localStorage.removeItem('checklist_pin_hash');
    setStatus('PIN removed — settings are now unlocked.', 'ok');
  } else {
    localStorage.setItem('checklist_pin_hash', simpleHash(val));
    settingsUnlocked = true;
    setStatus('PIN saved. You\'ll need it next time settings are opened.', 'ok');
  }
  document.getElementById('newPin').value = '';
  refreshPinStatus();
});

document.getElementById('lockNowBtn').addEventListener('click', ()=>{
  settingsUnlocked = false;
  settingsBox.open = false;
  setStatus('Settings locked.', 'ok');
});

// ---------- checklist behavior ----------
function updateCounts(){
  document.querySelectorAll('.block').forEach(block=>{
    const boxes = block.querySelectorAll('input[type=checkbox]');
    const checked = [...boxes].filter(b=>b.checked).length;
    block.querySelector('.count').textContent = `${checked} / ${boxes.length}`;
    block.classList.toggle('done', checked === boxes.length);
  });
}
document.querySelectorAll('input[type=checkbox]').forEach(box=>{
  box.addEventListener('change', ()=>{
    box.closest('.item').querySelector('span').classList.toggle('checked-text', box.checked);
    updateCounts();
  });
});
updateCounts();

document.getElementById('resetBtn').addEventListener('click', ()=>{
  document.querySelectorAll('input[type=checkbox]').forEach(b=>{
    b.checked = false;
    b.closest('.item').querySelector('span').classList.remove('checked-text');
  });
  document.querySelectorAll('.item-comment').forEach(c=> c.value = '');
  document.getElementById('sessionNotes').value = '';
  document.getElementById('operatorName').value = '';
  updateCounts();
  setStatus('Checklist reset.', 'ok');
});

function setStatus(msg, cls){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = cls || '';
}

// ---------- gather rows ----------
function gatherRows(){
  const now = new Date();
  const date = now.toISOString().slice(0,10);
  const time = now.toTimeString().slice(0,8);
  const operator = document.getElementById('operatorName').value.trim() || '(not entered)';
  const sessionNotes = document.getElementById('sessionNotes').value.trim();
  const rows = [];
  document.querySelectorAll('.block').forEach(block=>{
    const section = block.dataset.section;
    block.querySelectorAll('.item-row').forEach(row=>{
      const input = row.querySelector('input[type=checkbox]');
      const checked = input.checked;
      const text = row.querySelector('.item span').textContent;
      const comment = row.querySelector('.item-comment').value.trim();
      rows.push([date, time, operator, section, text, checked ? 'Y' : 'N', comment, sessionNotes]);
    });
  });
  return rows;
}

// ---------- GitHub push ----------
async function pushToGitHub(){
  const token = document.getElementById('ghToken').value.trim();
  const owner = document.getElementById('ghOwner').value.trim();
  const repo  = document.getElementById('ghRepo').value.trim();
  const branch = document.getElementById('ghBranch').value.trim() || 'main';
  const path  = document.getElementById('ghPath').value.trim() || 'log.xlsx';

  if(!token || !owner || !repo){
    setStatus('Fill in GitHub settings first (token, owner, repo).', 'err');
    document.getElementById('settingsBox').open = true;
    return;
  }

  if(!document.getElementById('operatorName').value.trim()){
    setStatus('Enter the operator name before pushing.', 'err');
    document.getElementById('operatorName').focus();
    return;
  }

  setStatus('Reading existing log from GitHub...', '');
  document.getElementById('pushBtn').disabled = true;

  const apiBase = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const headers = {
    'Authorization': `token ${token}`,
    'Accept': 'application/vnd.github+json'
  };

  try{
    let existingRows = [['Date','Time','Operator','Section','Item','Checked','Item Comment','Session Notes']];
    let sha = null;

    const getResp = await fetch(`${apiBase}?ref=${branch}`, { headers });
    if(getResp.status === 200){
      const data = await getResp.json();
      sha = data.sha;
      const binary = atob(data.content.replace(/\n/g,''));
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      const wb = XLSX.read(bytes, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      existingRows = XLSX.utils.sheet_to_json(ws, { header:1 });
      if(existingRows.length === 0){
        existingRows = [['Date','Time','Operator','Section','Item','Checked','Item Comment','Session Notes']];
      }
    } else if(getResp.status !== 404){
      const errText = await getResp.text();
      throw new Error(`GitHub read failed (${getResp.status}): ${errText}`);
    }

    setStatus('Building updated log file...', '');
    const newRows = gatherRows();
    const allRows = existingRows.concat(newRows);

    const newWs = XLSX.utils.aoa_to_sheet(allRows);
    const newWb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(newWb, newWs, 'Log');
    const wbArray = XLSX.write(newWb, { bookType:'xlsx', type:'array' });

    let binaryStr = '';
    const bytes2 = new Uint8Array(wbArray);
    for(let i=0;i<bytes2.length;i++) binaryStr += String.fromCharCode(bytes2[i]);
    const base64Content = btoa(binaryStr);

    setStatus('Pushing to GitHub...', '');
    const putBody = {
      message: `Checklist log update ${new Date().toISOString()}`,
      content: base64Content,
      branch: branch
    };
    if(sha) putBody.sha = sha;

    const putResp = await fetch(apiBase, {
      method: 'PUT',
      headers: { ...headers, 'Content-Type': 'application/json' },
      body: JSON.stringify(putBody)
    });

    if(!putResp.ok){
      const errText = await putResp.text();
      throw new Error(`GitHub write failed (${putResp.status}): ${errText}`);
    }

    setStatus(`Logged ${newRows.length} rows to ${path} on ${branch}.`, 'ok');
  } catch(err){
    console.error(err);
    setStatus('Error: ' + err.message, 'err');
  } finally {
    document.getElementById('pushBtn').disabled = false;
  }
}

document.getElementById('pushBtn').addEventListener('click', pushToGitHub);
</script>

</body>
</html>
